# Preview on GitHub Pages (https://lanternata-anteprima.mapped-dev.it).
# Every push to main goes online here in about a minute (GIT-02).
# The site stays noindex: PUBLIC_SITE_INDEXABLE is NOT set here and must never
# be (SEO-10): a preview is never indexable.
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PREVIEW_HOST: lanternata-anteprima.mapped-dev.it

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build (preview URL, noindex)
        run: npm run build
        env:
          SITE_URL: https://${{ env.PREVIEW_HOST }}
      - name: Custom domain for GitHub Pages
        run: echo "${{ env.PREVIEW_HOST }}" > dist/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
